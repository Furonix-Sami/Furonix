<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart | Furonix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header id="shared-header"></header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10 min-h-[50vh]">
      <h1 class="text-3xl font-black text-slate-900 mb-8">Your Cart</h1>
      
      <div id="cart-content" class="flex flex-col lg:flex-row gap-10 hidden">
        
        <!-- Cart Items -->
        <div class="flex-1">
          <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100" id="cart-items-container">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Order Summary -->
        <div class="w-full lg:w-96 flex-shrink-0">
          <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 sticky top-28">
            <h2 class="text-xl font-bold text-slate-900 mb-6">Order Summary</h2>
            
            <div class="space-y-4 text-slate-600 border-b border-slate-100 pb-6 mb-6">
              <div class="flex justify-between">
                <span>Subtotal</span>
                <span class="font-medium text-slate-900" id="summary-subtotal">Rs. 0</span>
              </div>
              <div class="flex justify-between text-sm">
                <span>Delivery</span>
                <span class="text-slate-400">Calculated at checkout</span>
              </div>
            </div>
            
            <div class="flex justify-between items-center mb-8">
              <span class="font-bold text-slate-900">Total</span>
              <span class="text-2xl font-black text-blue-700" id="summary-total">Rs. 0</span>
            </div>
            
            <a href="/checkout.html" class="w-full block text-center bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-full font-bold shadow-lg transition-all hover:-translate-y-0.5 text-lg">
              Proceed to Checkout
            </a>
            
            <div class="mt-4 text-center">
              <a href="/shop.html" class="text-blue-600 font-medium text-sm hover:underline">Continue Shopping</a>
            </div>
          </div>
        </div>

      </div>

      <!-- Empty Cart -->
      <div id="empty-cart" class="text-center py-20 hidden bg-white rounded-3xl border border-slate-100 shadow-sm">
        <div class="w-24 h-24 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center mx-auto mb-6">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Your cart is empty</h2>
        <p class="text-slate-500 mb-8 max-w-sm mx-auto">Looks like you haven't added any products to your cart yet.</p>
        <a href="/shop.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white py-3 px-8 rounded-full font-semibold transition-colors">Start Shopping</a>
      </div>

    </main>

    <footer id="shared-footer"></footer>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
      function renderCartPage() {
        const content = document.getElementById('cart-content');
        const empty = document.getElementById('empty-cart');
        const container = document.getElementById('cart-items-container');
        
        if (cart.length === 0) {
          content.classList.add('hidden');
          empty.classList.remove('hidden');
          return;
        }

        content.classList.remove('hidden');
        empty.classList.add('hidden');
        container.innerHTML = '';
        
        let subtotal = 0;

        cart.forEach((item, index) => {
          const itemTotal = item.price * item.quantity;
          subtotal += itemTotal;
          
          const div = document.createElement('div');
          div.className = `flex flex-col sm:flex-row items-start sm:items-center gap-6 py-6 ${index !== cart.length - 1 ? 'border-b border-slate-100' : ''}`;
          
          div.innerHTML = `
            <div class="w-24 h-24 bg-slate-50 rounded-2xl p-2 flex-shrink-0 flex items-center justify-center">
              <img src="${item.image}" alt="${item.name}" class="object-cover max-h-full mix-blend-multiply">
            </div>
            <div class="flex-1">
              <p class="text-xs font-semibold text-blue-500 mb-1 uppercase">${item.category}</p>
              <h3 class="font-bold text-slate-900 text-lg mb-1"><a href="/product.html?id=${item.id}" class="hover:text-blue-600">${item.name}</a></h3>
              <p class="font-bold text-slate-900">Rs. ${item.price.toLocaleString()}</p>
            </div>
            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-start mt-4 sm:mt-0">
              <div class="flex items-center bg-slate-50 rounded-full border border-slate-200">
                <button onclick="updateItemQty('${item.id}', -1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:text-blue-600 rounded-l-full">&minus;</button>
                <span class="w-8 text-center font-semibold text-slate-900 text-sm">${item.quantity}</span>
                <button onclick="updateItemQty('${item.id}', 1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:text-blue-600 rounded-r-full">&plus;</button>
              </div>
              <button onclick="removeItem('${item.id}')" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded-full transition-colors" title="Remove Item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          `;
          container.appendChild(div);
        });

        document.getElementById('summary-subtotal').textContent = `Rs. ${subtotal.toLocaleString()}`;
        document.getElementById('summary-total').textContent = `Rs. ${subtotal.toLocaleString()}`;
      }

      function updateItemQty(id, change) {
        const item = cart.find(i => i.id === id);
        if (item) {
          item.quantity += change;
          if (item.quantity <= 0) {
            removeItem(id);
          } else {
            saveCart();
            renderCartPage();
          }
        }
      }

      function removeItem(id) {
        cart = cart.filter(i => i.id !== id);
        saveCart();
        renderCartPage();
      }

      document.addEventListener('DOMContentLoaded', renderCartPage);
    </script>
  </body>
</html>
