<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product | Furonix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header id="shared-header"></header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
      
      <!-- Breadcrumbs -->
      <nav class="flex text-sm text-gray-500 mb-8" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-3">
          <li class="inline-flex items-center">
            <a href="/index.html" class="hover:text-indigo-600 transition-colors">Home</a>
          </li>
          <li>
            <div class="flex items-center">
              <svg class="w-4 h-4 text-gray-400 mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
              <a href="/shop.html" id="bc-category" class="hover:text-indigo-600 transition-colors">Category</a>
            </div>
          </li>
          <li aria-current="page">
            <div class="flex items-center">
              <svg class="w-4 h-4 text-gray-400 mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
              <span id="bc-name" class="text-gray-800 font-medium line-clamp-1">Product Name</span>
            </div>
          </li>
        </ol>
      </nav>

      <div id="product-container" class="grid grid-cols-1 md:grid-cols-2 gap-12 mb-20 hidden">
        <!-- Image Gallery -->
        <div class="flex flex-col gap-4">
          <div class="bg-white rounded-3xl p-8 aspect-square flex items-center justify-center border border-gray-100 shadow-sm relative overflow-hidden group">
            <img id="main-image" src="" alt="Product" class="object-cover max-h-full mix-blend-multiply transition-transform duration-500 group-hover:scale-105">
          </div>
        </div>

        <!-- Details -->
        <div class="flex flex-col">
          <p id="p-category" class="text-blue-600 font-semibold tracking-wide uppercase text-sm mb-2">Category</p>
          <h1 id="p-name" class="text-3xl md:text-4xl font-black text-slate-900 mb-6 leading-tight">Product Name</h1>
          
          <div class="bg-blue-50 border border-blue-100 rounded-2xl p-6 mb-8 inline-block self-start">
            <span class="text-slate-500 text-sm block mb-1">Price</span>
            <span id="p-price" class="text-3xl font-bold text-blue-700">Rs. 0</span>
          </div>

          <p id="p-desc" class="text-slate-600 text-lg mb-8 leading-relaxed"></p>

          <div class="mb-8">
            <h3 class="font-bold text-slate-900 mb-4 text-lg">Key Specifications</h3>
            <ul id="p-specs" class="space-y-2">
              <!-- populated by JS -->
            </ul>
          </div>

          <!-- Actions -->
          <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm mt-auto">
            <div class="flex items-center gap-4 mb-6">
              <span class="font-medium text-slate-700">Quantity</span>
              <div class="flex items-center bg-slate-50 rounded-full border border-slate-200">
                <button id="qty-minus" class="w-10 h-10 flex items-center justify-center text-slate-600 hover:text-blue-600 rounded-l-full transition-colors">&minus;</button>
                <input type="number" id="qty-input" value="1" min="1" max="10" class="w-12 text-center bg-transparent border-none outline-none font-semibold text-slate-900 appearance-none pointer-events-none" readonly>
                <button id="qty-plus" class="w-10 h-10 flex items-center justify-center text-slate-600 hover:text-blue-600 rounded-r-full transition-colors">&plus;</button>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <button id="btn-add" class="border border-blue-600 text-blue-600 hover:bg-blue-50 py-4 rounded-full font-bold transition-colors text-lg flex items-center justify-center gap-2 uppercase tracking-tight text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Add to Cart
              </button>
              <button id="btn-buy" class="bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-full font-bold shadow-lg transition-all text-lg uppercase tracking-tight text-sm">
                Buy Now
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Error State -->
      <div id="error-container" class="hidden py-20 text-center">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Product Not Found</h2>
        <a href="/shop.html" class="text-indigo-600 hover:underline">Return to Shop</a>
      </div>

    </main>

    <footer id="shared-footer"></footer>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await loadFuronixData();

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        const product = sampleProducts.find(p => p.id === productId);
        
        if (product) {
          document.getElementById('product-container').classList.remove('hidden');
          
          // Populate data
          document.title = `${product.name} | Furonix`;
          document.getElementById('main-image').src = product.image;
          document.getElementById('p-category').textContent = product.category;
          document.getElementById('p-name').textContent = product.name;
          document.getElementById('p-price').textContent = `Rs. ${product.price.toLocaleString()}`;
          document.getElementById('p-desc').textContent = product.description;
          
          document.getElementById('bc-category').textContent = product.category;
          document.getElementById('bc-category').href = `/shop.html?category=${encodeURIComponent(product.category)}`;
          document.getElementById('bc-name').textContent = product.name;

          const specsUl = document.getElementById('p-specs');
          if (product.specs) {
            product.specs.forEach(spec => {
              specsUl.innerHTML += `
                <li class="flex items-center gap-3 text-slate-700">
                  <div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div>
                  ${spec}
                </li>
              `;
            });
          }

          // Qty Logic
          const qtyInput = document.getElementById('qty-input');
          document.getElementById('qty-minus').addEventListener('click', () => {
            let val = parseInt(qtyInput.value);
            if (val > 1) qtyInput.value = val - 1;
          });
          document.getElementById('qty-plus').addEventListener('click', () => {
            let val = parseInt(qtyInput.value);
            if (val < Number(product.stock)) qtyInput.value = val + 1;
          });

          // Action Logic
          if (Number(product.stock) <= 0) {
            document.getElementById('btn-add').disabled = true;
            document.getElementById('btn-buy').disabled = true;
            document.getElementById('btn-add').classList.add('opacity-40', 'cursor-not-allowed');
            document.getElementById('btn-buy').classList.add('opacity-40', 'cursor-not-allowed');
            document.getElementById('qty-plus').disabled = true;
            document.getElementById('qty-minus').disabled = true;
          }

          document.getElementById('btn-add').addEventListener('click', () => {
            addToCart(product.id, qtyInput.value);
          });
          
          document.getElementById('btn-buy').addEventListener('click', () => {
            addToCart(product.id, qtyInput.value);
            window.location.href = '/checkout.html';
          });

        } else {
          document.getElementById('error-container').classList.remove('hidden');
        }
      });
    </script>
  </body>
</html>
