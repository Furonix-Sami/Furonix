<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Furonix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css?v=2">
  </head>
  <body>
    <header id="shared-header"></header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
      <div class="mb-8">
        <h1 class="text-3xl font-black text-slate-900">Secure Checkout</h1>
        <p class="text-slate-500">Guest Checkout</p>
      </div>
      
      <div class="flex flex-col lg:flex-row gap-10">
        
        <div class="flex-1">
          <form id="checkout-form" class="space-y-8">
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
              <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                <span class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-sm">1</span>
                Contact Information
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name *</label>
                  <input type="text" id="name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                </div>
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Phone Number *</label>
                  <input type="tel" id="phone" required placeholder="03XXXXXXXXX" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                </div>
                <div class="md:col-span-2">
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address (Optional)</label>
                  <input type="email" id="email" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                </div>
              </div>
            </div>
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
              <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                <span class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-sm">2</span>
                Shipping Address
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Full Address *</label>
                  <input type="text" id="address" required placeholder="House, Street, Area" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                </div>
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2">City *</label>
                  <input type="text" id="city" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                </div>
              </div>
            </div>
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
              <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                <span class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-sm">3</span>
                Payment Method
              </h2>
              <div class="space-y-4">                
                <label class="flex items-start p-4 border rounded-2xl cursor-pointer transition-colors relative border-blue-600 bg-blue-50" id="label-cod">
                  <div class="flex items-center h-5">
                    <input type="radio" name="payment" value="cod" checked class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
                  </div>
                  <div class="ml-3">
                    <span class="block text-sm font-bold text-slate-900">Cash on Delivery (COD)</span>
                    <span class="block text-sm text-slate-500">Pay when you receive the package.</span>
                    <span class="block text-sm font-semibold text-blue-600 mt-1">Delivery Charge: Rs. <span id="charge-cod">200</span></span>
                  </div>
                </label>
                <label class="flex items-start p-4 border border-slate-200 rounded-2xl cursor-pointer transition-colors hover:bg-slate-50" id="label-advance">
                  <div class="flex items-center h-5">
                    <input type="radio" name="payment" value="advance" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
                  </div>
                  <div class="ml-3">
                    <span class="block text-sm font-bold text-slate-900">Advance Payment</span>
                    <span class="block text-sm text-slate-500">Pay via Bank Transfer or EasyPaisa/JazzCash before delivery.</span>
                    <span class="block text-sm font-semibold text-green-600 mt-1">Discounted Delivery: Rs. <span id="charge-adv">100</span></span>
                  </div>
                </label>
              </div>
            </div>
          </form>
        </div>
        <div class="w-full lg:w-[400px] flex-shrink-0">
          <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 sticky top-28">
            <h2 class="text-xl font-bold text-slate-900 mb-6">Your Order</h2>
            
            <div id="checkout-items" class="space-y-4 mb-6 max-h-60 overflow-y-auto pr-2">           
            </div>
            <div class="space-y-3 text-sm text-slate-600 border-t border-b border-slate-100 py-6 mb-6">
              <div class="flex justify-between">
                <span>Subtotal</span>
                <span class="font-medium text-slate-900" id="chk-subtotal">Rs. 0</span>
              </div>
              <div class="flex justify-between">
                <span>Delivery Fee</span>
                <span class="font-medium text-slate-900" id="chk-delivery">Rs. 0</span>
              </div>
            </div>
            <div class="flex justify-between items-center mb-8">
              <span class="font-bold text-slate-900">Total to Pay</span>
              <span class="text-2xl font-black text-blue-700" id="chk-total">Rs. 0</span>
            </div>
            <button form="checkout-form" type="submit" class="w-full block text-center bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-full font-bold shadow-lg shadow-blue-200 transition-all hover:shadow-xl hover:-translate-y-0.5 text-lg">
              Place Order
            </button>
            <p class="text-xs text-center text-slate-400 mt-4">By placing this order, you agree to our terms of service.</p>
          </div>
        </div>
      </div>
    </main>
    <footer id="shared-footer"></footer>
    <script src="js/config.js?v=2"></script>
    <script src="js/api.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
    <script>
      let subtotal = 0;
      let deliveryFee = 0;
      function renderCheckoutSummary() {
        const container = document.getElementById('checkout-items');
        container.innerHTML = '';
        subtotal = 0;

        if (cart.length === 0) {
          window.location.href = 'cart.html';
          return;
        }

        cart.forEach(item => {
          subtotal += (item.price * item.quantity);
          container.innerHTML += `
            <div class="flex gap-4">
              <div class="w-16 h-16 bg-slate-50 rounded-xl p-1 flex-shrink-0 flex items-center justify-center">
                <img src="${item.image}" class="object-cover max-h-full mix-blend-multiply">
              </div>
              <div class="flex-1 flex flex-col justify-center">
                <p class="font-semibold text-slate-900 text-sm line-clamp-1">${item.name}</p>
                <div class="flex justify-between text-xs text-slate-500 mt-1">
                  <span>Qty: ${item.quantity}</span>
                  <span class="font-medium text-slate-900">Rs. ${(item.price * item.quantity).toLocaleString()}</span>
                </div>
              </div>
            </div>
          `;
        });
        updateTotals();
      }
      function updateTotals() {
        document.getElementById('chk-subtotal').textContent = `Rs. ${subtotal.toLocaleString()}`;
        document.getElementById('chk-delivery').textContent = `Rs. ${deliveryFee.toLocaleString()}`;
        document.getElementById('chk-total').textContent = `Rs. ${(subtotal + deliveryFee).toLocaleString()}`;
      }

      function showCheckoutError(message) {
        let box = document.getElementById('checkout-error');
        if (!box) {
          box = document.createElement('div');
          box.id = 'checkout-error';
          box.className = 'bg-red-50 border border-red-100 text-red-600 text-sm rounded-2xl p-4 mb-6';
          document.getElementById('checkout-form').prepend(box);
        }
        box.textContent = message;
        window.scrollTo(0, 0);
      }

      document.addEventListener('DOMContentLoaded', async () => {
        await loadFuronixData();

        deliveryFee = deliveryCharges.cod;
        document.getElementById('charge-cod').textContent = deliveryCharges.cod;
        document.getElementById('charge-adv').textContent = deliveryCharges.advance;
        
        renderCheckoutSummary();
        const radios = document.querySelectorAll('input[name="payment"]');
        const labelCod = document.getElementById('label-cod');
        const labelAdv = document.getElementById('label-advance');

        radios.forEach(radio => {
          radio.addEventListener('change', (e) => {
            if (e.target.value === 'cod') {
              deliveryFee = deliveryCharges.cod;
              labelCod.classList.add('border-blue-600', 'bg-blue-50');
              labelCod.classList.remove('border-slate-200');
              labelAdv.classList.remove('border-blue-600', 'bg-blue-50');
              labelAdv.classList.add('border-slate-200');
            } else {
              deliveryFee = deliveryCharges.advance;
              labelAdv.classList.add('border-blue-600', 'bg-blue-50');
              labelAdv.classList.remove('border-slate-200');
              labelCod.classList.remove('border-blue-600', 'bg-blue-50');
              labelCod.classList.add('border-slate-200');
            }
            updateTotals();
          });
        });
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = document.querySelector('button[form="checkout-form"]');
          submitBtn.disabled = true;
          submitBtn.textContent = 'Placing order...';

          const paymentValue = document.querySelector('input[name="payment"]:checked').value;
          const orderData = {
            customerName: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim(),
            address: document.getElementById('address').value.trim(),
            city: document.getElementById('city').value.trim(),
            paymentMethod: paymentValue === 'cod' ? 'COD' : 'Advance',
            items: cart.map(item => ({ productId: item.id, quantity: item.quantity }))
          };

          const res = await apiPost('createOrder', orderData);

          submitBtn.disabled = false;
          submitBtn.textContent = 'Place Order';

          if (!res.success) {
            showCheckoutError(res.message);
            return;
          }
          localStorage.setItem('furonix_last_order', JSON.stringify(res.data));
          localStorage.removeItem('furonix_cart');

          window.location.href = 'order-success.html';
        });
      });
    </script>
  </body>
</html>
