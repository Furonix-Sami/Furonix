<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furonix | Premium Smart Electronics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header id="shared-header"></header>

    <main>
      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <div class="bg-gradient-to-br from-blue-600 via-indigo-600 to-blue-700 rounded-[2rem] p-5 md:p-6 flex flex-col md:flex-row items-center justify-between text-white shadow-xl relative overflow-hidden">
          <div class="relative z-10 max-w-lg mb-8 md:mb-0" id="hero-text" style="opacity:0; transition: opacity .25s ease;">
            <span class="bg-white/20 text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-widest backdrop-blur-md">Limited Edition</span>
            <h1 id="banner-heading" class="text-2xl md:text-4xl font-extrabold mt-3 leading-tight">Upgrade Your<br/>Tech Lifestyle.</h1>
            <p id="banner-description" class="text-blue-100 text-sm md:text-base mt-4 opacity-90">Discover the latest Furonix S9 Series Smart Watches & Pro Audio.</p>
            <a href="shop.html" id="banner-button" class="inline-block mt-6 bg-white text-blue-600 px-8 py-3 rounded-full text-sm font-bold shadow-lg hover:bg-blue-50 transition-colors">Explore All Gear</a>
          </div>
          <div class="absolute right-0 top-0 h-full w-1/2 md:w-1/3 bg-white/10 skew-x-12 transform origin-bottom"></div>
          <div class="w-48 h-48 bg-white/20 rounded-full blur-3xl absolute -bottom-10 -right-10 pointer-events-none"></div>
          <div class="relative z-10 w-full max-w-xs md:max-w-sm ml-auto" id="hero-image-wrap" style="opacity:0; transition: opacity .25s ease;">
            <img id="banner-image" src="" alt="Hero" class="w-full rounded-2xl shadow-2xl transform md:rotate-6 border-4 border-white/10">
          </div>
        </div>
      </section>

      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-16">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-gray-900">Shop by Category</h2>
        </div>
        <div class="flex gap-3 overflow-x-auto pb-4 hide-scrollbar" id="category-pills">
        </div>
      </section>

      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12">
        <div class="flex items-center justify-between mb-8">
          <h2 class="text-2xl font-extrabold text-slate-800">Featured Products</h2>
          <a href="shop.html" class="text-blue-600 font-bold hover:text-blue-700 text-sm">View All &rarr;</a>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="featured-products">
        </div>
      </section>

    </main>

    <footer id="shared-footer"></footer>
    <style>
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await loadFuronixData();

        const s = window.siteSettings || {};
        if (s.bannerHeading) document.getElementById('banner-heading').textContent = s.bannerHeading;
        if (s.bannerDescription) document.getElementById('banner-description').textContent = s.bannerDescription;
        if (s.bannerButtonText) document.getElementById('banner-button').textContent = s.bannerButtonText;
        if (s.bannerImage) document.getElementById('banner-image').src = driveImg(s.bannerImage);

        document.getElementById('hero-text').style.opacity = '1';
        document.getElementById('hero-image-wrap').style.opacity = '1';
        const catContainer = document.getElementById('category-pills');
        categories.forEach(cat => {
          const a = document.createElement('a');
          a.href = `shop.html?category=${encodeURIComponent(cat)}`;
          a.className = cat === 'All' 
            ? 'whitespace-nowrap px-5 py-1.5 bg-blue-600 text-white rounded-full text-xs font-bold shadow-md'
            : 'whitespace-nowrap px-5 py-1.5 bg-white text-slate-600 border border-slate-200 rounded-full text-xs font-semibold hover:border-blue-300 hover:text-blue-600 transition-colors';
          a.textContent = cat;
          catContainer.appendChild(a);
        });

        const featuredContainer = document.getElementById('featured-products');
        if (sampleProducts.length === 0) {
          featuredContainer.innerHTML = '<p class="text-slate-400 col-span-full text-center py-10">No products yet.</p>';
        } else {
          const featured = sampleProducts.filter(p => p.featured);
          const toShow = (featured.length > 0 ? featured : sampleProducts).slice(0, 8);
          toShow.forEach(product => {
            featuredContainer.innerHTML += createProductCard(product);
          });
        }
      });
    </script>
  </body>
</html>
