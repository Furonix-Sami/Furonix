<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furonix | Premium Smart Electronics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
      :root {
        --theme-color: #3b82f6;
        --button-color: #3b82f6;
        --text-color: #1e293b;
      }
      body { color: var(--text-color); }
      .theme-bg { background-color: var(--theme-color); }
      .button-bg { background-color: var(--button-color); }
      .theme-text { color: var(--theme-color); }
    </style>
  </head>
  <body>
    <header id="shared-header"></header>

    <main>
      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <div class="bg-gradient-to-br from-emerald-50 via-green-100 to-emerald-50 rounded-2xl px-6 py-5 md:px-10 md:py-6 flex items-center justify-between relative overflow-hidden border border-emerald-100">
          <!-- decorative wave shapes -->
          <svg class="absolute -right-10 -top-10 w-64 h-64 text-emerald-200 opacity-70 pointer-events-none" viewBox="0 0 200 200" fill="currentColor">
            <path d="M45.3,-58.5C58.4,-49.7,68.6,-35.7,72.4,-19.9C76.2,-4.1,73.6,13.5,65.6,28.1C57.6,42.6,44.2,54.1,29.1,61.2C14,68.3,-2.8,71,-19.2,67.6C-35.6,64.2,-51.7,54.7,-61.9,40.8C-72.1,26.9,-76.4,8.5,-73.6,-8.3C-70.8,-25.1,-60.9,-40.3,-47.6,-49.3C-34.3,-58.3,-17.1,-61.1,0.5,-61.7C18.2,-62.4,32.2,-67.3,45.3,-58.5Z" transform="translate(100 100)" />
          </svg>
          <svg class="absolute -left-16 -bottom-16 w-56 h-56 text-emerald-300 opacity-40 pointer-events-none" viewBox="0 0 200 200" fill="currentColor">
            <path d="M45.3,-58.5C58.4,-49.7,68.6,-35.7,72.4,-19.9C76.2,-4.1,73.6,13.5,65.6,28.1C57.6,42.6,44.2,54.1,29.1,61.2C14,68.3,-2.8,71,-19.2,67.6C-35.6,64.2,-51.7,54.7,-61.9,40.8C-72.1,26.9,-76.4,8.5,-73.6,-8.3C-70.8,-25.1,-60.9,-40.3,-47.6,-49.3C-34.3,-58.3,-17.1,-61.1,0.5,-61.7C18.2,-62.4,32.2,-67.3,45.3,-58.5Z" transform="translate(100 100)" />
          </svg>

          <div class="relative z-10 max-w-md" id="hero-text" style="opacity:0; transition: opacity .25s ease;">
            <span class="text-emerald-700 text-[10px] font-black tracking-widest uppercase">New Arrival</span>
            <h1 id="banner-heading" class="text-xl md:text-3xl font-black text-slate-900 mt-1 leading-tight">Upgrade Your <span class="text-emerald-600">Tech</span> Lifestyle</h1>
            <p id="banner-description" class="text-slate-600 text-xs md:text-sm mt-2">Discover the latest Furonix Smart Watches &amp; Pro Audio.</p>
            <a href="shop.html" id="banner-button" class="inline-block mt-4 bg-emerald-600 text-white px-6 py-2.5 rounded-full text-xs font-bold shadow-md hover:bg-emerald-700 transition-colors">Buy Now</a>
          </div>

          <div class="relative z-10 w-40 md:w-56 shrink-0 hidden" id="hero-image-wrap" style="opacity:0; transition: opacity .25s ease;">
            <img id="banner-image" src="" alt="Hero" class="w-full h-full object-contain drop-shadow-xl">
          </div>
        </div>
      </section>

      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-16">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-gray-900">Shop by Category</h2>
        </div>
        <div class="flex gap-3 overflow-x-auto pb-4 hide-scrollbar" id="category-pills">
        </div>
      </section>

      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12">
        <div class="flex items-center justify-between mb-8">
          <h2 class="text-2xl font-extrabold text-slate-800">Featured Products</h2>
          <a href="shop.html" class="theme-text font-bold hover:opacity-80 text-sm">View All &rarr;</a>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="featured-products">
        </div>
      </section>

    </main>

    <footer id="shared-footer"></footer>
    <style>
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await loadFuronixData();

        const s = window.siteSettings || {};
        
        // 1. APPLY DYNAMIC COLORS
        if (s.themeColor) document.documentElement.style.setProperty('--theme-color', s.themeColor);
        if (s.buttonColor) {
          document.documentElement.style.setProperty('--button-color', s.buttonColor);
          const bannerBtn = document.getElementById('banner-button');
          if (bannerBtn) bannerBtn.style.backgroundColor = s.buttonColor;
        }
        if (s.textColor) document.documentElement.style.setProperty('--text-color', s.textColor);

        // 2. APPLY BANNER SETTINGS (With Size Control)
        if (s.bannerHeading) document.getElementById('banner-heading').textContent = s.bannerHeading;
        if (s.bannerDescription) document.getElementById('banner-description').textContent = s.bannerDescription;
        if (s.bannerButtonText) document.getElementById('banner-button').textContent = s.bannerButtonText;

        if (s.bannerImage) {
          const bannerImg = document.getElementById('banner-image');
          bannerImg.src = driveImg(s.bannerImage);
          if (s.bannerHeight) {
            bannerImg.style.height = s.bannerHeight + 'px';
          }
          if (s.bannerFit) {
            bannerImg.style.objectFit = s.bannerFit;
          }
          document.getElementById('hero-image-wrap').classList.remove('hidden');
        }

        document.getElementById('hero-text').style.opacity = '1';
        document.getElementById('hero-image-wrap').style.opacity = '1';

        const catContainer = document.getElementById('category-pills');
        categories.forEach(cat => {
          const a = document.createElement('a');
          a.href = `shop.html?category=${encodeURIComponent(cat)}`;
          a.className = cat === 'All' 
            ? 'whitespace-nowrap px-5 py-1.5 button-bg text-white rounded-full text-xs font-bold shadow-md'
            : 'whitespace-nowrap px-5 py-1.5 bg-white text-slate-600 border border-slate-200 rounded-full text-xs font-semibold hover:opacity-80 transition-colors';
          a.textContent = cat;
          catContainer.appendChild(a);
        });

        const featuredContainer = document.getElementById('featured-products');
        if (sampleProducts.length === 0) {
          featuredContainer.innerHTML = '<p class="text-slate-400 col-span-full text-center py-10">No products yet.</p>';
        } else {
          const featured = sampleProducts.filter(p => p.featured);
          const toShow = (featured.length > 0 ? featured : sampleProducts).slice(0, 8);
          toShow.forEach(product => {
            featuredContainer.innerHTML += createProductCard(product);
          });
        }

        // 3. CUSTOMER POPUP MESSAGE BOX
        if (s.popupEnabled === 'true' || s.popupEnabled === true) {
          if (!sessionStorage.getItem('furonix_popup_closed')) {
            showFuronixPopup(s);
          }
        }

        // 4. ADD YOUTUBE & TIKTOK TO FOOTER (If exists)
        const footer = document.getElementById('shared-footer');
        if (footer) {
          setTimeout(() => {
            if (s.youtubeUrl) {
              footer.insertAdjacentHTML('beforeend', `<a href="${s.youtubeUrl}" target="_blank" style="color:#ff0000; font-size:24px; margin-left:10px;">▶</a>`);
            }
            if (s.tiktokUrl) {
              footer.insertAdjacentHTML('beforeend', `<a href="${s.tiktokUrl}" target="_blank" style="color:#000000; font-size:24px; margin-left:10px;">🎵</a>`);
            }
          }, 1500); // 1.5 seconds wait for footer to load
        }
      });

      // Popup Functions
      function showFuronixPopup(s) {
        const popupHTML = `
          <div id="furonix-popup-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;">
            <div style="background:#fff; padding:40px; border-radius:20px; max-width:400px; width:100%; text-align:center; position:relative; font-family:sans-serif;">
              <span onclick="closeFuronixPopup()" style="position:absolute; top:10px; right:15px; font-size:28px; cursor:pointer; color:#94a3b8; font-weight:bold;">&times;</span>
              <h3 style="font-size:24px; font-weight:800; color:${s.themeColor || '#000'}; margin-bottom:15px;">${s.popupTitle || 'Special Offer'}</h3>
              <p style="color:#475569; margin-bottom:25px; line-height:1.5;">${s.popupMessage || ''}</p>
              ${s.popupLink ? `<a href="${s.popupLink}" style="background:${s.buttonColor || '#000'}; color:#fff; padding:12px 30px; border-radius:30px; text-decoration:none; font-weight:bold; display:inline-block;">Shop Now</a>` : ''}
            </div>
          </div>
        `;
        document.body.insertAdjacentHTML('beforeend', popupHTML);
      }

      function closeFuronixPopup() {
        const popup = document.getElementById('furonix-popup-overlay');
        if (popup) popup.remove();
        sessionStorage.setItem('furonix_popup_closed', 'true');
      }
    </script>
  </body>
</html>
