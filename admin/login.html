<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Furonix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body class="bg-slate-50 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 text-white font-black text-3xl mb-4 shadow-lg shadow-blue-200">F</div>
      <h2 class="text-3xl font-black text-slate-900">Admin Portal</h2>
      <p class="mt-2 text-sm text-slate-600">Sign in to manage your store.</p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
      <div class="bg-white py-10 px-6 sm:px-10 shadow-xl shadow-slate-200/50 rounded-3xl border border-slate-100">
        <form class="space-y-6" id="admin-login-form">
          
          <div>
            <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
            <input id="username" name="username" type="text" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          </div>

          <div>
            <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
            <input id="password" name="password" type="password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          </div>

          <div>
            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-md shadow-blue-200 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all hover:-translate-y-0.5">
              Sign in
            </button>
          </div>
          
          <div class="text-center text-xs text-slate-400 pt-4">
            Guest checkout for customers — this login is for the store owner only.
          </div>
        </form>
      </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
      if (getAdminToken()) window.location.href = 'dashboard.html';

      document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        const res = await apiPost('adminLogin', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        });

        btn.disabled = false;
        btn.textContent = 'Sign in';

        if (!res.success) {
          let box = document.getElementById('login-error');
          if (!box) {
            box = document.createElement('div');
            box.id = 'login-error';
            box.className = 'bg-red-50 border border-red-100 text-red-600 text-sm rounded-xl p-3 mb-4';
            e.target.prepend(box);
          }
          box.textContent = res.message;
          return;
        }

        setAdminToken(res.data.token, res.data.username);
        window.location.href = 'dashboard.html';
      });
    </script>
  </body>
</html>
